<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  body { width: 420px; font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  textarea { width: 100%; height: 180px; box-sizing: border-box; font-size: 12px; }
  .buttons { margin-top: 8px; display: flex; gap: 8px; }
  button { padding: 6px 12px; cursor: pointer; }
  #status { font-size: 12px; margin-top: 6px; color: #555; }
</style>
</head>
<body>
  <h1 id="title">YouTube-Tabs</h1>
  <textarea id="links" readonly></textarea>
  <div class="buttons">
    <button id="copy">copy all</button>
    <button id="download">save as .txt</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
