<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>YouTube-Tabs Übersicht</title>
    <style>
        :root { --bg: #fff; --card: #f3f3f3; --text: #111; --muted: #666; --border: #d4d4d4; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #181818; --card: #262626; --text: #eee; --muted: #999; --border: #3a3a3a; }
        }
        body { margin: 0; padding: 24px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
        header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0; }
        #meta { color: var(--muted); font-size: 14px; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min, 260px), 1fr)); gap: 16px; }
        button {
        font: inherit; font-size: 13px; color: var(--text);
        background: transparent; border: 1px solid var(--border); border-radius: 8px;
        padding: 6px 14px; cursor: pointer;
        transition: background-color .15s, color .15s, transform .1s;
        }
        button:hover { background: var(--card); }
        button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
        #copy { margin-left: auto; }
        #sizes { display: flex; gap: 2px; padding: 3px; background: var(--card); border-radius: 10px; }
        #sizes button { border: none; border-radius: 7px; padding: 5px 12px; color: var(--muted); }
        #sizes button:hover { background: transparent; color: var(--text); }
        #sizes button.active { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; display: block; }
        .card:hover { outline: 2px solid #888; }
        .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #444; }
        .placeholder { display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 13px; }
        .info { padding: 10px 12px; }
        .title { font-size: 14px; font-weight: 600; line-height: 1.3; display: -webkit-box; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .url { font-size: 11px; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        </style>
</head>
<body>
    <header>
        <h1>YouTube-Tabs</h1>
        <span id="meta"></span>
        <div id="sizes">
            <button data-size="small">Small</button>
            <button data-size="medium">Medium</button>
            <button data-size="large">Large</button>
        </div>
    </header>
    <div id="grid"></div>
    <script src="overview.js"></script>
</body>
</html>
